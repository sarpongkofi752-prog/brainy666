<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brainy666hub</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#070708;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;transition:.3s;min-height:100vh}
  body.light{background:#f5f5f7;color:#111}
  .wrap{max-width:520px;margin:0 auto;padding:24px 20px 80px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
  .logo{width:44px;height:44px;background:#fff;color:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
  .url{color:#666;font-size:13px;background:#111;padding:6px 12px;border-radius:20px;border:1px solid #222}
  body.light .url{background:#fff;color:#888;border-color:#e5e5e5}
  .num{color:#00E5FF;font-weight:800;font-size:14px;letter-spacing:1px;margin-bottom:8px}
  h1{font-size:42px;font-weight:800;letter-spacing:-1.5px;margin-bottom:8px}
  .sub{color:#888;font-size:15px;margin-bottom:28px}
  body.light .sub{color:#666}
  .card{background:#141416;border:1px solid #222;border-radius:28px;padding:20px}
  body.light .card{background:#fff;border-color:#e5e5e5;box-shadow:0 10px 30px rgba(0,0,0,.06)}
  .row{background:#1E1E20;border-radius:18px;padding:18px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  body.light .row{background:#f5f5f7}
  .row b{font-size:15px}
  .row small{color:#888;font-size:12.5px}
  /* Toggle */
  .switch{width:48px;height:28px;background:#333;border-radius:20px;position:relative;cursor:pointer;transition:.3s}
  .switch.on{background:#00E5FF}
  body.light .switch{background:#ddd}
  body.light .switch.on{background:#111}
  .switch:after{content:'';width:22px;height:22px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.3s}
  .switch.on:after{transform:translateX(20px)}
  .btn{width:100%;background:#FF2D55;color:#fff;border:0;padding:18px;border-radius:16px;font-weight:800;font-size:14px;letter-spacing:.5px;margin-top:8px;cursor:pointer}
  .btn:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">B6</div>
    <div class="url">brainy666hub.netlify.app</div>
  </div>

  <div class="num">07</div>
  <h1>Settings</h1>
  <div class="sub">Customize your brainy666hub.</div>

  <div class="card">
    <div class="row">
      <div><b>Light Mode</b><br><small>Switch to light theme</small></div>
      <div class="switch" id="lightSw" onclick="toggleLight()"></div>
    </div>
    <div class="row">
      <div><b>Animations</b><br><small>Enable UI animations</small></div>
      <div class="switch on" id="animSw" onclick="this.classList.toggle('on')"></div>
    </div>
    <button class="btn" onclick="localStorage.clear();location.reload()">CLEAR LOCAL SETTINGS</button>
  </div>

  <div style="text-align:center;margin-top:30px;color:#555;font-size:13px">Built by Sarpong • 2026</div>
</div>

<script>
  const body=document.body;
  const lightSw=document.getElementById('lightSw');
  function toggleLight(){
    lightSw.classList.toggle('on');
    body.classList.toggle('light');
    localStorage.setItem('light', body.classList.contains('light'))
  }
  if(localStorage.getItem('light')==='true'){ body.classList.add('light'); lightSw.classList.add('on'); }
</script>
</body>
  </html>
